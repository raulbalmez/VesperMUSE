# general settings
name: Enhancement_RetinexFormer_LOL_v1
model_type: ImageCleanModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage_Segmentation
    dataroot_gt: data/PST900_RGBT_Dataset/train/labels/
    dataroot_lq: data/PST900_RGBT_Dataset/train/rgb/
    lq_second: data/PST900_RGBT_Dataset/train/thermal/
    geometric_augs: true
    train_size: [640, 360]

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 2

    ### -------------Progressive training--------------------------
    # mini_batch_sizes: [8,8,4,2,1]             # Batch size per gpu   
    # iters: [46000,32000,24000,18000,18000,12000]
    # gt_size: 384   # Max patch size for progressive training
    # gt_sizes: [192,256,320,384,416]  # Patch sizes for progressive training.
    # ### ------------------------------------------------------------

    ### ------- Training on single fixed-patch size 128x128---------
    mini_batch_sizes: [2]   
    iters: [150000]
    gt_size: 256
    gt_sizes: [256]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage_Segmentation
    dataroot_gt: data/PST900_RGBT_Dataset/test/labels/
    dataroot_lq: data/PST900_RGBT_Dataset/test/rgb/
    lq_second: data/PST900_RGBT_Dataset/test/thermal/
    io_backend:
      type: disk

# network structures
network_g:
  type: Multeenhancer_General_Seg
  in_channels: 4
  out_channels: 1
  n_feat: 32


# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 40000
  warmup_iter: 1500 # no warm up
  use_grad_clip: true
  grad_clip_norm: 1.0
  

  # Split 300k iterations into two cycles. 
  # 1st cycle: fixed 3e-4 LR for 92k iters. 
  # 2nd cycle: cosine annealing (3e-4 to 1e-6) for 208k iters.
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [40000]
    restart_weights: [1]
    eta_mins: [0.000001]  
  
  mixing_augs:
    mixup: false
    use_identity: true


  optim_g:
    type: AdamW              # 1. Use AdamW for transformers
    lr: !!float 1e-4         # 2. This is the NEW, HIGH base LR
    weight_decay: !!float 0.01 
    betas: [0.9, 0.999]

    # 3. This block applies a LOW LR to the PRETRAINED parts
    paramwise_cfg:
      custom_keys:
        # We match the names from your printout.
        # Note: 'backbone' is the name of your network 'g'.
        
        # Target all params starting with this string:
        'backbone.fusion_module.stem_r':
          lr_mult: 0.1  # LR will be 3e-4 * 0.1 = 3e-5
          
        'backbone.fusion_module.layer1':
          lr_mult: 0.1  # LR will be 3e-5
          
        'backbone.fusion_module.layer2':
          lr_mult: 0.1  # LR will be 3e-5
          
        'backbone.fusion_module.layer3':
          lr_mult: 0.1  # LR will be 3e-5
          
        'backbone.fusion_module.layer4':
          lr_mult: 0.1  # LR will be 3e-5

  
  
  
  # losses
  pixel_opt:
    type: SegmentationLoss


# validation settings
val:
  window_size: 4
  val_freq: !!float 500
  save_img: false
  rgb2bgr: false
  use_image: false
  max_minibatch: 8

  metrics:
    # psnr: # metric name, can be arbitrary
    #   type: calculate_psnr
    #   crop_border: 0
    #   test_y_channel: false
    absrel_mae:
        type: calculate_miou
# logging settings
logger:
  print_freq: 500
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: low_light
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
