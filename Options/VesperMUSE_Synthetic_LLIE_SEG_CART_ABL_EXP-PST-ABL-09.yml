# general settings
name: Enhancement_RetinexFormer_LOL_v1
model_type: ImageCleanModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100
task: Segmentation
# task: Enhancement
# dataset_name: PST900
# dataset_name: MFNet
dataset_name: CART
num_classes: 10

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage_Segmentation
    dataroot_gt: data/CART/train/segmentation/
    dataroot_lq: data/CART/train/color_syn_ll_hv/
    lq_second: data/CART/train/thermal/
    geometric_augs: true
    train_size: [960, 600]
    random_crop: [480, 400]

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4

    ### -------------Progressive training--------------------------
    # mini_batch_sizes: [8,8,4,2,1]             # Batch size per gpu   
    # iters: [46000,32000,24000,18000,18000,12000]
    # gt_size: 384   # Max patch size for progressive training
    # gt_sizes: [192,256,320,384,416]  # Patch sizes for progressive training.
    # ### ------------------------------------------------------------

    ### ------- Training on single fixed-patch size 128x128---------
    mini_batch_sizes: [4]   
    iters: [150000]
    gt_size: 256
    gt_sizes: [256]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage_Segmentation
    dataroot_gt: data/CART/test/split1/test/segmentation/
    dataroot_lq: data/CART/test/split1/test/color_syn_ll_hv/
    lq_second: data/CART/test/split1/test/thermal/
    io_backend:
      type: disk

# network structures
network_g:
  type: VesperMUSE_General_Seg_concatfusion
  num_classes: 10


# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 80000
  warmup_iter: 1500 # no warm up
  use_grad_clip: true
  grad_clip_norm: 0.1
  

  # Split 300k iterations into two cycles. 
  # 1st cycle: fixed 3e-4 LR for 92k iters. 
  # 2nd cycle: cosine annealing (3e-4 to 1e-6) for 208k iters.
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 20000
    eta_min: !!float 1e-7
  
  mixing_augs:
    mixup: false
    use_identity: true


  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 0.05
    betas: [0.9, 0.999]
  
  
  # losses
  pixel_opt:
    type: CART_Loss
    deep_supervision: true


# validation settings
val:
  window_size: 4
  val_freq: !!float 500
  save_img: false
  rgb2bgr: false
  use_image: false
  max_minibatch: 8

  metrics:
    # psnr: # metric name, can be arbitrary
    #   type: calculate_psnr
    #   crop_border: 0
    #   test_y_channel: false
    miou:
        type: calculate_miou
# logging settings
logger:
  print_freq: 500
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: low_light
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
